[project]
name = "science-scout-mcp"
version = "0.2.0"
description = "Deterministic science-news fetching and story grouping for Claude, as a remote MCP server."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
    "feedparser>=6.0.11,<7",
    "uvicorn>=0.30",
]

[project.scripts]
science-scout = "science_scout.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/science_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
